<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Primitive Pictures</title>
  <meta name="description" content="Turn any photo into a picture made of triangles, circles and other shapes. Runs entirely in your browser. Download as PNG, JPG, SVG, GIF or JSON.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M3 27L15 5l12 22z' fill='%232d4bff'/%3E%3Ccircle cx='21' cy='12' r='7' fill='%23ffb020' fill-opacity='.85'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="#/" aria-label="Primitive Pictures, home">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
        <path d="M3 27L15 5l12 22z" fill="var(--accent)"/>
        <circle cx="21" cy="12" r="7" fill="var(--sun)" fill-opacity=".85"/>
        <rect x="4" y="4" width="9" height="9" rx="1" fill="var(--ink)" fill-opacity=".85" transform="rotate(-12 8 8)"/>
      </svg>
      <span>Primitive Pictures</span>
    </a>
    <span class="privacy">Runs in your browser. Photos never leave your device.</span>
  </header>

  <main id="app" tabindex="-1">
    <noscript><p class="notice">This app needs JavaScript to turn photos into shapes.</p></noscript>
  </main>

  <footer class="site-footer">
    Based on the open-source <a href="https://github.com/fogleman/primitive" rel="noopener">primitive</a> algorithm by Michael Fogleman.
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
